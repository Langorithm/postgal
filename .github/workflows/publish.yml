name: Publish Progress

on:
  push:
    branches: [main]
    paths:
      - "captures/**"
      - "!captures/index.json"
      - "!captures/.gitkeep"

jobs:
  # ── 1. Detect which file was just added ──────────────────────────────────
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_file: ${{ steps.detect.outputs.has_file }}
      file: ${{ steps.detect.outputs.file }}
      caption: ${{ steps.detect.outputs.caption }}
      is_video: ${{ steps.detect.outputs.is_video }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: detect
        run: |
          FILE=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- captures/ \
            | grep -viE '(index\.json|\.gitkeep)' | head -1)

          if [ -z "$FILE" ]; then
            echo "has_file=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CAPTION=$(git log -1 --pretty=%s)
          echo "$FILE" | grep -qiE '\.(mp4|mov|avi|mkv|webm)$' \
            && IS_VIDEO=true || IS_VIDEO=false

          echo "has_file=true"   >> "$GITHUB_OUTPUT"
          echo "file=$FILE"      >> "$GITHUB_OUTPUT"
          echo "caption=$CAPTION">> "$GITHUB_OUTPUT"
          echo "is_video=$IS_VIDEO" >> "$GITHUB_OUTPUT"

  # ── 2. Convert video → WebP for gallery (skipped for images) ─────────────
  convert:
    needs: detect
    if: needs.detect.outputs.has_file == 'true' && needs.detect.outputs.is_video == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get install -y ffmpeg

      - name: Convert to animated WebP
        run: |
          FILE="${{ needs.detect.outputs.file }}"
          BASE="${FILE%.*}"

          ffmpeg -i "$FILE" \
            -vcodec libwebp -lossless 0 -compression_level 6 \
            -q:v 70 -loop 0 -preset picture -an -vsync 0 \
            "${BASE}.webp"

      - uses: actions/upload-artifact@v4
        with:
          name: converted
          path: captures/*.webp

  # ── 3. Upload to GitHub Releases, update index.json, remove from repo ────
  release-upload:
    needs: [detect, convert]
    if: |
      always() &&
      needs.detect.result == 'success' &&
      needs.detect.outputs.has_file == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: needs.detect.outputs.is_video == 'true' && needs.convert.result == 'success'
        with:
          name: converted
          path: captures/

      - name: Ensure media release exists
        run: gh release view media || gh release create media --title "Media" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: upload
        name: Upload assets and update index.json
        run: |
          FILE="${{ needs.detect.outputs.file }}"
          FILENAME=$(basename "$FILE")

          if [ "${{ needs.detect.outputs.is_video }}" = "true" ]; then
            WEBP="${FILE%.*}.webp"
            gh release upload media "$WEBP" --clobber
            URL="https://github.com/${{ github.repository }}/releases/download/media/$(basename $WEBP)"
          else
            gh release upload media "$FILE" --clobber
            URL="https://github.com/${{ github.repository }}/releases/download/media/${FILENAME}"
          fi

          python3 - captures/index.json "$FILENAME" "$URL" <<'PYEOF'
          import json, sys
          path, filename, url = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(path) as f:
              data = json.load(f)
          for entry in data:
              if entry['file'] == filename:
                  entry['url'] = url
                  break
          with open(path, 'w') as f:
              json.dump(data, f, indent=2)
          PYEOF

          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove capture from repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm "${{ needs.detect.outputs.file }}"
          git add captures/index.json
          git commit -m "Move $(basename ${{ needs.detect.outputs.file }}) to releases [skip ci]"
          git push

  # ── 4. Post to all socials ───────────────────────────────────────────────
  publish:
    needs: [detect, convert, release-upload]
    if: |
      always() &&
      needs.detect.result == 'success' &&
      needs.detect.outputs.has_file == 'true' &&
      needs.release-upload.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r publish/requirements.txt

      - name: Post to socials
        working-directory: publish
        env:
          BLUESKY_HANDLE:         ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD:   ${{ secrets.BLUESKY_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID:    ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_GROUP_ID:      ${{ secrets.TELEGRAM_GROUP_ID }}
          TUMBLR_CONSUMER_KEY:    ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_OAUTH_TOKEN:     ${{ secrets.TUMBLR_OAUTH_TOKEN }}
          TUMBLR_OAUTH_SECRET:    ${{ secrets.TUMBLR_OAUTH_SECRET }}
          TUMBLR_BLOG_NAME:       ${{ secrets.TUMBLR_BLOG_NAME }}
          REDDIT_CLIENT_ID:       ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET:   ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME:        ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD:        ${{ secrets.REDDIT_PASSWORD }}
          REDDIT_SUBREDDIT:       ${{ secrets.REDDIT_SUBREDDIT }}
        run: |
          python publish.py "../${{ needs.detect.outputs.file }}" "${{ needs.detect.outputs.caption }}"
