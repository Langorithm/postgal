<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postgal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d0d0d;
      color: #d0d0d0;
      padding: 2rem 1rem;
    }
    h1 {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #fff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
    }
    .media {
      aspect-ratio: 16 / 9;
      background: #111;
      overflow: hidden;
    }
    .media img,
    .media video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .meta {
      padding: 0.75rem 1rem;
    }
    .caption {
      font-size: 0.875rem;
      line-height: 1.4;
      margin-bottom: 0.3rem;
    }
    time {
      font-size: 0.75rem;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Postgal</h1>
  <div class="grid" id="grid"></div>
  <script>
    const VIDEO_EXTS = new Set(['.mp4', '.mov', '.webm']);

    fetch('captures/index.json')
      .then(r => r.json())
      .then(entries => {
        const grid = document.getElementById('grid');
        grid.innerHTML = entries.map(({ file, caption, timestamp }) => {
          const ext = file.slice(file.lastIndexOf('.')).toLowerCase();
          const src = `captures/${file}`;
          const date = timestamp ? timestamp.slice(0, 10) : '';
          const safe = caption.replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const media = VIDEO_EXTS.has(ext)
            ? `<video src="${src}" controls loop muted playsinline></video>`
            : `<img src="${src}" alt="${safe}" loading="lazy">`;
          return `
            <article class="card">
              <div class="media">${media}</div>
              <div class="meta">
                <p class="caption">${safe || file}</p>
                <time>${date}</time>
              </div>
            </article>`;
        }).join('');
      });
  </script>
</body>
</html>
