<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Postgal</title>
        <style>
            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

            :root {
                --bg:           #0d0d0d;
                --surface:      #1a1a1a;
                --text:         #d0d0d0;
                --text-dim:     #555;
                --border:       rgba(255,255,255,0.07);
                --border-hover: rgba(255,255,255,0.16);
            }

            html { scroll-behavior: smooth; }

            body {
                font-family: ui-monospace, 'Cascadia Code', 'SF Mono', 'Fira Code', Menlo, monospace;
                background: var(--bg);
                color: var(--text);
                min-height: 100vh;
                overflow-x: hidden;
            }

            /* ── Header ── */
            header {
                position: sticky;
                top: 0;
                z-index: 20;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 1.25rem 2rem;
                background: rgba(13,13,13,0.85);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border-bottom: 1px solid var(--border);
            }

            .site-title {
                font-size: 0.7rem;
                font-weight: 700;
                letter-spacing: 0.35em;
                text-transform: uppercase;
                color: #fff;
            }

            .site-title::after {
                content: '_';
                animation: blink 1.2s step-end infinite;
            }

            @keyframes blink {
                0%, 100% { opacity: 1; }
                50%       { opacity: 0; }
            }

            .entry-count {
                font-size: 0.62rem;
                letter-spacing: 0.18em;
                color: var(--text-dim);
                text-transform: uppercase;
            }

            /* ── Grid wrapper ── */
            #archive { padding: 2rem 2rem 4rem; }

            /* ── Grid — 1px gaps act as grid lines ── */
            .grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 1px;
                background: var(--border);
                outline: 1px solid var(--border);
            }

            @media (max-width: 860px)  { .grid { grid-template-columns: repeat(2, 1fr); } }
            @media (max-width: 500px)  { .grid { grid-template-columns: 1fr; } }

            /* ── Card ── */
            .card {
                background: var(--bg);
                cursor: pointer;
                opacity: 0;
                transform: translateY(10px);
                transition:
                    opacity    0.38s ease,
                    transform  0.38s ease,
                    background 0.2s ease;
            }

            .card.visible { opacity: 1; transform: translateY(0); }
            .card:hover   { background: var(--surface); }

            .card-media {
                position: relative;
                aspect-ratio: 16 / 9;
                overflow: hidden;
            }

            .card-media img,
            .card-media video {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                transition: transform 0.4s ease, filter 0.4s ease;
            }

            .card:hover .card-media img,
            .card:hover .card-media video {
                transform: scale(1.045);
                filter: brightness(1.08);
            }

            .card-overlay {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: rgba(13,13,13,0);
                transition: background 0.3s ease;
            }

            .card:hover .card-overlay { background: rgba(13,13,13,0.28); }

            .expand-icon {
                width: 30px;
                height: 30px;
                border: 1px solid rgba(255,255,255,0.55);
                display: flex;
                align-items: center;
                justify-content: center;
                opacity: 0;
                transform: scale(0.75);
                transition: opacity 0.22s ease, transform 0.22s ease;
            }

            .expand-icon svg {
                width: 11px;
                height: 11px;
                stroke: #fff;
                fill: none;
                stroke-width: 1.5;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            .card:hover .expand-icon { opacity: 1; transform: scale(1); }

            .card-meta {
                padding: 0.7rem 0.9rem 0.85rem;
                border-top: 1px solid var(--border);
            }

            .card-caption {
                font-size: 0.72rem;
                line-height: 1.45;
                color: var(--text);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                margin-bottom: 0.3rem;
            }

            .card-date {
                font-size: 0.58rem;
                letter-spacing: 0.12em;
                color: var(--text-dim);
                text-transform: uppercase;
            }

            /* ── Lightbox ── */
            .lightbox {
                position: fixed;
                inset: 0;
                z-index: 100;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.28s ease;
            }

            .lightbox.open { opacity: 1; pointer-events: all; }

            .lb-backdrop {
                position: absolute;
                inset: 0;
                background: rgba(0,0,0,0.9);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                cursor: pointer;
            }

            .lb-inner {
                position: relative;
                z-index: 1;
                width: 100%;
                max-width: min(92vw, 1100px);
                transform: scale(0.96);
                transition: transform 0.28s ease;
            }

            .lightbox.open .lb-inner { transform: scale(1); }

            .lb-media {
                background: #000;
                display: flex;
                align-items: center;
                justify-content: center;
                max-height: 78vh;
            }

            .lb-media img,
            .lb-media video {
                max-width: 100%;
                max-height: 78vh;
                object-fit: contain;
                display: block;
            }

            .lb-footer {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 2rem;
                padding: 0.9rem 0 0;
            }

            .lb-caption {
                font-size: 0.8rem;
                color: var(--text);
                line-height: 1.5;
            }

            .lb-date {
                font-size: 0.6rem;
                letter-spacing: 0.16em;
                color: var(--text-dim);
                text-transform: uppercase;
                white-space: nowrap;
                padding-top: 0.18rem;
            }

            .lb-close {
                position: absolute;
                top: -2.75rem;
                right: 0;
                background: none;
                border: 1px solid var(--border);
                color: var(--text-dim);
                cursor: pointer;
                font-family: inherit;
                font-size: 0.6rem;
                letter-spacing: 0.22em;
                text-transform: uppercase;
                padding: 0.38em 0.75em;
                transition: color 0.2s, border-color 0.2s;
            }

            .lb-close:hover { color: var(--text); border-color: var(--border-hover); }

            /* ── Empty ── */
            .empty {
                padding: 5rem 2rem;
                text-align: center;
                font-size: 0.7rem;
                letter-spacing: 0.25em;
                text-transform: uppercase;
                color: var(--text-dim);
            }

            /* ── Mobile ── */
            @media (max-width: 600px) {
                header    { padding: 1rem 1.25rem; }
                #archive  { padding: 1.25rem 1.25rem 3rem; }
                .lightbox { padding: 1rem; }
                .lb-close { top: -2.4rem; }
            }
        </style>
    </head>
    <body>

        <header>
            <span class="site-title">postgal</span>
            <span class="entry-count" id="count"></span>
        </header>

        <section id="archive"></section>

        <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
            <div class="lb-backdrop" id="lb-backdrop"></div>
            <div class="lb-inner">
                <button class="lb-close" id="lb-close">close ×</button>
                <div class="lb-media" id="lb-media"></div>
                <div class="lb-footer">
                    <p class="lb-caption" id="lb-caption"></p>
                    <time class="lb-date" id="lb-date"></time>
                </div>
            </div>
        </div>

        <script>
            const VIDEO_EXTS = new Set(['.mp4', '.mov', '.webm']);
            const EXPAND_SVG = `<svg viewBox="0 0 12 12"><polyline points="7.5,1.5 10.5,1.5 10.5,4.5"/><polyline points="4.5,10.5 1.5,10.5 1.5,7.5"/><line x1="10.5" y1="1.5" x2="6.5" y2="5.5"/><line x1="1.5" y1="10.5" x2="5.5" y2="6.5"/></svg>`;

            const fileExt  = f => f.slice(f.lastIndexOf('.')).toLowerCase();
            const isVideo  = f => VIDEO_EXTS.has(fileExt(f));
            const safe     = s => s.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const thumbTag = (url, file) => isVideo(url)
                ? `<video src="${url}" muted loop playsinline></video>`
                : `<img src="${url}" alt="" loading="lazy">`;

            // ── Lightbox ──
            const lightbox  = document.getElementById('lightbox');
            const lbMedia   = document.getElementById('lb-media');
            const lbCaption = document.getElementById('lb-caption');
            const lbDate    = document.getElementById('lb-date');

            function openLightbox({ url, file, caption, timestamp }) {
                lbMedia.innerHTML = isVideo(url)
                    ? `<video src="${url}" controls loop playsinline autoplay></video>`
                    : `<img src="${url}" alt="${safe(caption || '')}">`;
                lbCaption.textContent = caption || file;
                lbDate.textContent = timestamp ? timestamp.slice(0, 10) : '';
                lightbox.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                lightbox.classList.remove('open');
                document.body.style.overflow = '';
                const vid = lbMedia.querySelector('video');
                if (vid) { vid.pause(); vid.src = ''; }
            }

            document.getElementById('lb-backdrop').addEventListener('click', closeLightbox);
            document.getElementById('lb-close').addEventListener('click', closeLightbox);
            document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

            // ── Intersection-based stagger reveal ──
            function observeCards() {
                const io = new IntersectionObserver(entries => {
                    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
                }, { threshold: 0.08 });
                document.querySelectorAll('.card').forEach((c, i) => {
                    c.style.transitionDelay = `${i * 55}ms`;
                    io.observe(c);
                });
            }

            // ── Render ──
            fetch('captures/index.json')
                .then(r => r.json())
                .then(entries => {
                    const archiveEl = document.getElementById('archive');

                    if (!entries.length) {
                        archiveEl.innerHTML = '<p class="empty">no captures yet</p>';
                        return;
                    }

                    document.getElementById('count').textContent =
                        `${entries.length} capture${entries.length !== 1 ? 's' : ''}`;

                    archiveEl.innerHTML = '<div class="grid" id="grid"></div>';

                    document.getElementById('grid').innerHTML = entries.map((entry, i) => `
                        <article class="card" data-i="${i}">
                            <div class="card-media">
                                ${thumbTag(entry.url, entry.file)}
                                <div class="card-overlay">
                                    <div class="expand-icon">${EXPAND_SVG}</div>
                                </div>
                            </div>
                            <div class="card-meta">
                                <p class="card-caption">${safe(entry.caption || entry.file)}</p>
                                <time class="card-date">${entry.timestamp ? entry.timestamp.slice(0, 10) : ''}</time>
                            </div>
                        </article>`).join('');

                    document.querySelectorAll('.card').forEach(card => {
                        card.addEventListener('click', () => openLightbox(entries[+card.dataset.i]));
                    });

                    observeCards();
                });
        </script>
    </body>
</html>
